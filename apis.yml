aid: acornmed
name: Acornmed
description: 'AcornMed Biotechnology Co., Ltd. (金橡医学) is a Beijing-headquartered precision-oncology
  company founded in 2018, with subsidiaries in Tianjin and Qingdao. It develops and operates
  next-generation-sequencing (NGS) diagnostics for solid tumors and hematologic malignancies —
  the AcornUI urine-based series for bladder, ureteral and renal-pelvic cancer rule-out and
  recurrence monitoring, AcornUPro-SEEK for prostate cancer screening, AcornOne 808 for solid
  tumors and AcornHema 521 for blood cancers — alongside CAP/ISO 15189 central-laboratory testing,
  companion-diagnostic co-development and real-world-data services for pharmaceutical partners.
  AcornMed is a clinical laboratory and IVD developer: it sells testing services to hospitals,
  physicians and pharma sponsors and publishes no public developer program, API, or
  machine-readable contract of any kind.'
